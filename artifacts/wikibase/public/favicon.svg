<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- White rounded background — keeps the logo lisible on dark tabs / dark OS themes -->
  <rect width="32" height="32" rx="6" ry="6" fill="white"/>
  <!-- Logo image, padded 2 px on each side -->
  <image href="images/site_logo.png" x="2" y="2" width="28" height="28" preserveAspectRatio="xMidYMid meet"/>
</svg>
