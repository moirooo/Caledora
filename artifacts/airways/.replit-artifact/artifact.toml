kind = "web"
previewPath = "/airways/"
title = "Caledora Airways"
description = "Application de réservation en ligne de Caledora Airways — compagnie aérienne nationale fictive de la République de Caledora. Recherche de vols, sélection de cabine et de sièges, confirmation de réservation, programme Aurora Miles. Intégrée au hub CaledoraOS."
version = "1.0.0"
id = "artifacts/airways"
router = "path"

[[services]]
name = "web"
paths = [ "/airways/" ]
localPort = 18556

[services.development]
run = "pnpm --filter @workspace/airways run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/airways", "run", "build" ]
serve = "static"
publicDir = "artifacts/airways/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18556"
BASE_PATH = "/airways/"
